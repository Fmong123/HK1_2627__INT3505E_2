openapi: 3.0.3
info:
  title: Practice 1 - Versioned User API
  version: 2.0.0
  description: v1 exposes full_name; v2 exposes first_name and last_name.
servers:
  - url: http://127.0.0.1:5000
paths:
  /api/v1/users/{uid}:
    get:
      operationId: getUserV1
      summary: Get a user with full_name
      deprecated: true
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User found
          headers:
            Sunset:
              $ref: '#/components/headers/Sunset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserV1'
        '404':
          description: User not found
          headers:
            Sunset:
              $ref: '#/components/headers/Sunset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v2/users/{uid}:
    get:
      operationId: getUserV2
      summary: Get a user with first_name and last_name
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserV2'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v2/users:
    post:
      operationId: createUserV2
      summary: Create a user in the shared in-memory store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUser'
            example:
              first_name: Linh
              last_name: Phạm
              email: linh@vnu.vn
      responses:
        '201':
          description: User created and readable from both versions
          headers:
            Location:
              description: Relative URL of the new v2 user
              schema:
                type: string
              example: /api/v2/users/3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserV2'
        '400':
          description: Malformed JSON, missing/extra fields, or invalid values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Content-Type must be application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  parameters:
    UserId:
      name: uid
      in: path
      required: true
      schema:
        type: integer
        minimum: 0
      example: 1
  headers:
    Sunset:
      description: Planned v1 retirement date in HTTP-date format; omitted when disabled.
      schema:
        type: string
      example: Thu, 31 Dec 2026 23:59:59 GMT
  responses:
    NotFound:
      description: User not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          example: nf
    NewUser:
      type: object
      additionalProperties: false
      required: [first_name, last_name, email]
      properties:
        first_name:
          type: string
          minLength: 1
          pattern: '\S'
          example: Văn
        last_name:
          type: string
          minLength: 1
          pattern: '\S'
          example: Nguyễn
        email:
          type: string
          pattern: '^[^@\s]+@[^@\s]+$'
          example: a@vnu.vn
    UserV1:
      type: object
      additionalProperties: false
      required: [id, full_name, email]
      properties:
        id:
          type: integer
          minimum: 1
        full_name:
          type: string
          example: Văn Nguyễn
        email:
          type: string
          example: a@vnu.vn
    UserV2:
      type: object
      additionalProperties: false
      required: [id, first_name, last_name, email]
      properties:
        id:
          type: integer
          minimum: 1
        first_name:
          $ref: '#/components/schemas/NewUser/properties/first_name'
        last_name:
          $ref: '#/components/schemas/NewUser/properties/last_name'
        email:
          $ref: '#/components/schemas/NewUser/properties/email'

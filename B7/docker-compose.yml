services:
  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      DB_URL: sqlite:////data/lab7.db
    volumes:
      - lab7_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/ready')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
volumes:
  lab7_data:
